<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodes live</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e3e3e0;--ok:#1f8a4c;--warn:#b25000;--bad:#c62828;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1c1c1f;--ink:#f2f2f2;--mute:#9a9aa0;--line:#2c2c30;--ok:#4cc38a;--warn:#ffb057;--bad:#ff6b6b;--accent:#8ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{padding:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.mute{color:var(--mute);font-size:13px}
main{display:grid;gap:12px;padding:0 16px 24px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.wide{grid-column:1/-1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px}
.row{border-top:1px solid var(--line);padding:8px 0}.row:first-of-type{border-top:0}
.name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.dec{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.proceed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.handoff{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.defer{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.escalate{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.path{margin-top:4px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-word}
.edge{color:var(--mute)}
.empty{color:var(--mute);font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:2px 4px;border-top:1px solid var(--line)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
</style>
</head>
<body>
<header>
  <h1>Nodes <span class="mute">live team graph</span></h1>
  <span class="mute"><select id="ws"></select> <span id="meta">connecting…</span></span>
</header>
<main>
  <section class="wide"><h2>Action gate: every edit passes through the graph first</h2><div id="decisions"></div></section>
  <section><h2>Agents and what they own (lease epoch)</h2><div id="sessions"></div></section>
  <section><h2>Hand-offs and waits</h2><div id="handoffs"></div></section>
  <section><h2>Facts, checked against their source</h2><div id="facts"></div></section>
  <section><h2>Event log</h2><div id="events"></div></section>
  <section><h2>FalkorDB latency per query (this server)</h2><div id="latency"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pathHtml = p => esc(p).replace(/(-[A-Z_]+-&gt;)/g, '<span class="edge">$1</span>');
const short = u => esc(String(u).replace(/^(fn|region|file):[^:]+:/, ""));
let ws = new URLSearchParams(location.search).get("ws") || "";
function render(s) {
  if (!ws && s.workspace) ws = s.workspace;
  $("ws").innerHTML = (s.workspaces || []).map(w => `<option ${w === ws ? "selected" : ""}>${esc(w)}</option>`).join("");
  $("meta").textContent = `${(s.sessions || []).length} agents · updated ${new Date().toLocaleTimeString()}`;
  $("decisions").innerHTML = (s.decisions || []).map(d => `<div class="row">
      <span class="dec ${esc(d.verdict)}">${esc(d.verdict)}</span> <span class="name">${esc(d.agent)}</span>
      <span class="mute">${esc(d.reason)}</span><div class="path">${pathHtml(d.path)}</div></div>`).join("")
    || '<div class="empty">No action has passed the gate yet.</div>';
  $("sessions").innerHTML = (s.sessions || []).map(a => `<div class="row"><span class="name">${esc(a.name)}</span>
      <span class="mute">${esc(a.status)}${a.commit ? " · done at " + esc(a.commit) : ""}${a.task ? " · " + esc(a.task) : ""}</span>
      <div class="chips">${a.owns.filter(o => o.uid).map(o => `<span class="chip">${short(o.uid)} · e${esc(o.epoch)}</span>`).join("")
      || '<span class="empty">owns nothing</span>'}</div></div>`).join("") || '<div class="empty">No agent has joined.</div>';
  const hand = (s.decisions || []).filter(d => d.verdict === "handoff");
  $("handoffs").innerHTML = hand.map(d => `<div class="row"><span class="dec handoff">handoff</span>
      <span class="name">${esc(d.agent)}</span><div class="path">${pathHtml(d.path)}</div>
      <div class="mute">snapshot ${esc(d.snapshot)}</div></div>`).join("")
    + (s.waits || []).map(w => `<div class="row"><span class="dec defer">waiting</span>
      <span class="name">${esc(w.from)}</span> waits for <span class="name">${esc(w.to)}</span> on <span class="chip">${short(w.unit)}</span></div>`).join("")
    || '<div class="empty">No hand-offs or waits.</div>';
  $("facts").innerHTML = (s.facts || []).map(f => `<div class="row">
      <span class="dec ${f.status === "source-checked" ? "proceed" : "escalate"}">${esc(f.status)}</span>
      <span class="name">${esc(f.by)}</span> <span class="mute">${esc(f.source)}</span><div>${esc(f.text)}</div></div>`).join("")
    || '<div class="empty">No facts posted.</div>';
  $("events").innerHTML = (s.events || []).slice(0, 15).map(e => `<div class="row"><span class="mute">
      ${new Date(e.t * 1000).toLocaleTimeString()}</span> <span class="name">${esc(e.agent)}</span> ${esc(e.kind)}
      <span class="mute">${esc(e.verdict || e.unit || e.commit || "")}</span></div>`).join("") || '<div class="empty">No events.</div>';
  $("latency").innerHTML = `<table>${Object.entries(s.latency || {}).map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td>${v.n}×</td><td>p50 ${v.p50_ms} ms</td><td>p99 ${v.p99_ms} ms</td></tr>`).join("")}</table>`;
}
async function tick() {
  try { render(await (await fetch("/api/state" + (ws ? "?ws=" + encodeURIComponent(ws) : ""))).json()); }
  catch (e) { $("meta").textContent = "server not reachable, retrying…"; }
  setTimeout(tick, 1500);
}
$("ws").onchange = e => { ws = e.target.value; };
tick();
</script>
</body>
</html>
